[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deepinfer-trace-analyzer"
version = "0.1.0.dev0"
description = "Summarize and diff DeepInfer torch chrome traces by step and kernel category."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = ["ijson>=3.3"]

[project.scripts]
deepinfer-trace-analyzer = "deepinfer_trace_analyzer.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/deepinfer_trace_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
